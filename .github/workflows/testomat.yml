name: E2E Tests (Testomat)

on:
  workflow_dispatch:
    inputs:
      testomatio:
        description: Testomat API token (optional; prefer secret)
        required: false
      run:
        description: Testomat Run ID (optional)
        required: false
      grep:
        description: Grep pattern (optional)
        required: false
      shard:
        description: Shard like 1/2 (optional)
        required: false
  repository_dispatch:
    types: [testomat.run]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NODE_ENV: test
      BASE_URL: ${{ secrets.BASE_URL }}
      TESTOMATIO: ${{ secrets.TESTOMATIO }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: |
          # Prefer token from event payload or workflow input; fallback to repo secret
          if [ -n "${{ github.event.client_payload.testomatio }}" ]; then
            export TESTOMATIO="${{ github.event.client_payload.testomatio }}";
          elif [ -n "${{ inputs.testomatio }}" ]; then
            export TESTOMATIO="${{ inputs.testomatio }}";
          fi
          if [ -z "$TESTOMATIO" ]; then
            export TESTOMATIO="${{ secrets.TESTOMATIO }}";
          fi

          # Optional run id from payload/input (not strictly needed by reporter)
          if [ -n "${{ github.event.client_payload.run }}" ]; then
            export TESTOMATIO_RUN_ID="${{ github.event.client_payload.run }}";
          elif [ -n "${{ inputs.run }}" ]; then
            export TESTOMATIO_RUN_ID="${{ inputs.run }}";
          fi

          if [ -n "${{ github.event.client_payload.grep }}" ]; then
            export GREP="${{ github.event.client_payload.grep }}";
          else
            export GREP="${{ inputs.grep }}";
          fi
          if [ -n "${{ github.event.client_payload.shard }}" ]; then
            export SHARD="--shard ${{ github.event.client_payload.shard }}";
          elif [ -n "${{ inputs.shard }}" ]; then
            export SHARD="--shard ${{ inputs.shard }}";
          else
            export SHARD="";
          fi
          TESTOMATIO=$TESTOMATIO npx playwright test ${GREP:+--grep $GREP} $SHARD

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report

